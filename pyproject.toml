[project]
name = "data-ingest"
version = "0.1.0"
description = "Pipeline de ingestao reprodutivel: contrato de dados, carga incremental idempotente, checagens de qualidade e manifesto de execucao."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Santos" }]
keywords = ["data-engineering", "etl", "data-quality", "data-contract", "idempotency"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "typer>=0.15",
]

[project.optional-dependencies]
http = ["httpx>=0.28"]

[project.scripts]
data-ingest = "dataingest.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = ["D100", "D104", "D105", "D107", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN201", "ANN001"]
"src/*/cli.py" = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# Sem python_version fixo: o mypy adota a versao do interpretador em uso.
# Fixar 3.11 faz a checagem quebrar ao rodar sob 3.12, porque os stubs de
# bibliotecas compiladas para 3.12 usam sintaxe que a versao fixada rejeita.
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
